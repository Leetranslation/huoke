[project]
name = "yxagent"
version = "0.1.0"
description = "AI 外贸获客 Agent 平台"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- 接入层：Web / API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # --- 配置与数据校验 ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # --- 鉴权 ---
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    # --- HTTP 客户端 ---
    "httpx>=0.27",
    # --- 数据访问层 ---
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # --- 异步任务（基础设施层）---
    "redis>=5.0",
    "celery>=5.4",
    # --- AI / Agent 层 ---
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
